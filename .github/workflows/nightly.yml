name: Nightly client matrix

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-client-matrix
  cancel-in-progress: true

jobs:
  client-matrix:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12.13"
      - name: Run clean-package M4 acceptance
        timeout-minutes: 12
        run: >-
          uv run --locked --no-dev python
          scripts/run_m4_acceptance.py
          --output "${{ runner.temp }}/m4/acceptance.json"
      - name: Run Filesystem application server acceptance
        timeout-minutes: 5
        run: >-
          uv run --locked --no-dev python
          scripts/run_m5_filesystem_acceptance.py
          --check
          --output "${{ runner.temp }}/m5-filesystem"
      - name: Run Git application server acceptance
        timeout-minutes: 8
        run: >-
          uv run --locked --no-dev python
          scripts/run_m5_git_acceptance.py
          --check
          --output "${{ runner.temp }}/m5-git"
      - name: Upload application-server diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-application-server-diagnostics-${{ runner.os }}
          path: |
            ${{ runner.temp }}/m5-filesystem
            ${{ runner.temp }}/m5-git
          if-no-files-found: warn
          retention-days: 7
