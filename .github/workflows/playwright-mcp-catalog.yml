name: Playwright MCP catalog example

on:
  pull_request:
    paths:
      - "examples/playwright-mcp-ci/**"
      - ".github/workflows/playwright-mcp-catalog.yml"
  push:
    branches: [main]
    paths:
      - "examples/playwright-mcp-ci/**"
      - ".github/workflows/playwright-mcp-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-catalogs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples/playwright-mcp-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Install the pinned Playwright MCP versions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the same version and the upgrade
        run: uv run --locked python verify.py
      - name: Upload the snapshots and comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-mcp-catalog-${{ runner.os }}
          path: examples/playwright-mcp-ci/artifacts/*.json
          if-no-files-found: warn
