name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub and PyPI (requires a matching release tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12.13"
          version: "0.11.28"
      - run: uv sync --locked
      - name: Verify package version and release notes
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(uv version --short)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/v${version}.md"
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF" = "refs/tags/v${version}"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - name: Run clean-package acceptance
        timeout-minutes: 12
        run: >-
          uv run python scripts/run_m4_acceptance.py
          --output "${{ runner.temp }}/m4/acceptance.json"
          --dist-output dist
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: docs/releases/v${{ steps.version.outputs.version }}.md
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  github-release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: release-notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "mcp-statecheck $VERSION" \
            --notes-file "release-notes/v${VERSION}.md"

  pypi-publish:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-statecheck
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - run: uv publish --trusted-publishing always dist/*
