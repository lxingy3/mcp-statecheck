name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: >-
          uv run python scripts/run_m1_acceptance.py
          --output "${{ runner.temp }}/m1"
      - name: Run M2 HTTP classification slice
        timeout-minutes: 4
        run: uv run python scripts/run_m2_slice.py --fixture http-error-as-timeout --output "${{ runner.temp }}/m2/http-error-as-timeout.json"
      - name: Run M2 lifecycle slice
        timeout-minutes: 4
        run: uv run python scripts/run_m2_slice.py --output "${{ runner.temp }}/m2/request-before-initialized.json"
      - name: Run M2 duplicate request ID slice
        timeout-minutes: 4
        run: uv run python scripts/run_m2_slice.py --fixture duplicate-concurrent-request-id --output "${{ runner.temp }}/m2/duplicate-concurrent-request-id.json"
      - name: Run M2 cancellation correlation slice
        timeout-minutes: 4
        run: uv run python scripts/run_m2_slice.py --fixture late-response-after-cancellation --output "${{ runner.temp }}/m2/late-response-after-cancellation.json"
      - name: Run M2 SSE resume slice
        timeout-minutes: 4
        run: uv run python scripts/run_m2_slice.py --fixture second-sse-resume-token-loss --output "${{ runner.temp }}/m2/second-sse-resume-token-loss.json"
      - name: Run M3 real SDK stdio matrix
        timeout-minutes: 15
        run: uv run python scripts/run_m3_stdio_matrix.py --check
      - run: uv build
