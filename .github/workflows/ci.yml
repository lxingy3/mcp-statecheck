name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: >-
          uv run python scripts/run_m1_acceptance.py
          --output "${{ runner.temp }}/m1"
      - name: Run completed M2 slices
        timeout-minutes: 2
        run: |
          uv run python scripts/run_m2_slice.py --output "${{ runner.temp }}/m2/request-before-initialized.json"
          uv run python scripts/run_m2_slice.py --fixture duplicate-concurrent-request-id --output "${{ runner.temp }}/m2/duplicate-concurrent-request-id.json"
      - run: uv build
